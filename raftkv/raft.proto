syntax = "proto3";

package raftkv;

service Raft {
  rpc RequestVote(VoteRequest) returns (VoteReply);
  rpc AppendEntries(AppendRequest) returns (AppendReply);
  rpc ServeClient(ServeClientArgs) returns (ServeClientReply);
  rpc Inspect(InspectRequest) returns (NodeStatus);
}

message VoteRequest {
  uint64 term = 1;
  string candidate_id = 2;
  uint64 last_log_index = 3;
  uint64 last_log_term = 4;
  uint64 lease_config_ms = 5;
}

message VoteReply {
  uint64 term = 1;
  bool granted = 2;
  uint64 old_lease_remaining_ms = 3;
}

message LogEntry {
  uint64 term = 1;
  bool noop = 2;
  string key = 3;
  string value = 4;
  string request_id = 5;
}

message AppendRequest {
  uint64 term = 1;
  string leader_id = 2;
  uint64 prev_log_index = 3;
  uint64 prev_log_term = 4;
  repeated LogEntry entries = 5;
  uint64 leader_commit = 6;
  uint64 lease_duration_ms = 7;
  uint64 lease_config_ms = 8;
}

message AppendReply {
  uint64 term = 1;
  bool success = 2;
}

message ServeClientArgs {
  string Request = 1;
  string RequestID = 2;
}

message ServeClientReply {
  string Data = 1;
  string LeaderID = 2;
  bool Success = 3;
}

message InspectRequest {}

message NodeStatus {
  string role = 1;
  uint64 term = 2;
  uint64 log_index = 3;
  uint64 commit_index = 4;
  string leader_id = 5;
  bool ready = 6;
  uint64 lease_remaining_ms = 7;
  uint64 handoff_remaining_ms = 8;
  uint64 replication_rounds = 9;
}
